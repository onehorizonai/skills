name: Codex Plugin Scanner
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: hashgraph-online/hol-codex-plugin-scanner-action@02fa5e2d8f8b87dde86b0391aad2f7b89d055e24
