name: Codex Plugin Scanner
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: hashgraph-online/hol-codex-plugin-scanner-action@4c3daabf5f4c03212265c4a4e98bbd5655fd2190
