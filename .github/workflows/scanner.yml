name: Codex Plugin Scanner
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: hashgraph-online/hol-codex-plugin-scanner-action@d1cd95a6684acde9950c8d53561890d6ca735675
